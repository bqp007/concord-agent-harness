# concord.py executor settings. Format: key = value  (whole-line or " #" comments)
# Model names live in models.conf; the *.model keys here are only harness fallbacks used with
# --via <executor> when no model ID is given. Empty = refuse to run (a harness default could be
# any model, including a paid one).

# OpenCode launches under macOS sandbox-exec with concord/opencode.sandbox.sb: ~/.ssh, ~/.aws and other credential
# stores are unreadable; writes go only to the worktree, OpenCode's data and cache dirs, $TMPDIR and the run
# folder. --no-sandbox or CONCORD_NO_SANDBOX=1 turns the wrapper off; it is also skipped when sandbox-exec cannot
# apply (nested sandbox). Extra repository roots to deny reads of, colon-separated (optional):
opencode.sandbox = yes
# opencode.sandbox_deny = ~/src/work:~/src/private

opencode.model =
qwen.model =
pi.model =
dsh.model =
kimi.model =

# Unattended approval policy
qwen.approval = yolo              # yolo | auto (LLM classifier blocks risky actions)
kimi.approval = --auto            # --auto (never asks) | -y (asks on risky actions; stalls headless until the wall limit)
dsh.permission = workspace-write  # dsh's own sandbox: writes only inside the repo | danger-full-access
dsh.approval = never              # approval prompts patched off for headless runs | ask (stalls headless)

# Wall-clock limit per run
wall = 30m

# Segmented --review / --review-pr: how many segment reviewers run at once (default 3)
# review_parallel = 3

# Monitor gitignored paths in the before/after snapshot (about 0.2 s on a large repository). --no-ignored overrides.
track_ignored = yes

# Red run: acceptance commands run once on the untouched tree before every run (and Characterize commands
# before and after). --no-baseline skips it for one run. Timeout applies per command.
baseline = yes
check_timeout = 300s

# Post-run acceptance: the acceptance commands run again on the changed tree, after the post-run snapshot, so
# their artifacts are not blamed on the executor. A red run turned green is visible; `acceptance_after = no`
# turns it off.
acceptance_after = yes

# Static checks (zero model tokens): ruff on the phase's Python files before and after every run; the report
# lists only NEW findings. Uses ruff on PATH or a Python with the ruff module.
static_checks = yes
# static.ruff = /opt/anaconda3/bin/python3 -m ruff

# Extra "generated" globs (comma or space separated), matched against a path's basename and every parent
# directory name. Untracked or gitignored out-of-scope paths that match are listed but not counted as
# violations; everything else counts, gitignored or not. Built-ins cover __pycache__, build, dist, out, target,
# node_modules, .venv, .pytest_cache, .hypothesis, *.o, *.log, ... (GENERATED_GLOBS in concord.py).
generated =

# Binary overrides (auto-detected when unset)
# qwen.bin = ~/.local/bin/qwen
# opencode.bin = ~/.opencode/bin/opencode
# pi.bin = /opt/homebrew/bin/pi
# dsh.bin = /opt/homebrew/bin/dsh
# kimi.bin = ~/.kimi-code/bin/kimi
