# wt.py settings per repository (key = the main checkout's folder name).
#   <repo>.links = folders shared from the main checkout as symlinks (must be fully untracked: big data,
#                  third-party sources, venvs). wt.py refuses a folder that holds tracked files.
#   <repo>.base  = branch new ticket branches start from (default: the remote's default branch).
# Hookify rules (.claude/hookify.*.local.md) and .claude/settings.local.json are always COPIED in
# (hookify ignores symlinked rule files; gitignored files exist only in the checkout that made them).

# Example (key = the main checkout's folder name):
# my-repo.links = .venv data/raw
# my-repo.base = origin/main
