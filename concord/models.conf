# Model registry for /delegate. Name a model in plain words; this table picks the harness and ID.
#
#   alias[, alias ...]  =  executor  model-id
#
# executor: claude (Claude Code implementer subagent) | opencode | qwen | pi | dsh | kimi
# Matching ignores case, spaces, dots, dashes and underscores, so "DeepSeek V4 Pro",
# "deepseek-v4-pro" and "deepseek pro" all land on the same line. Exact aliases win; otherwise
# every word you say must appear in the line, and the closest model ID wins. The FIRST alias is
# the name shown in reports, so put the specific name first.
# A raw provider/model ID also works: opencode-go/... and opencode/... run on pi, Zen free IDs (opencode/...-free)
# and any other provider on OpenCode. The opencode/ and opencode-go/ lines below run on the pi executor (kit-pi),
# except the Zen free lines; --via opencode still reaches OpenCode.
# Force a harness per run with --via <executor>.
#
# Billing:
#   plain names ("deepseek flash", "glm", "kimi", "qwen") -> OpenCode Go subscription allowance
#     (provider opencode-go; metered at official vendor prices; DeepSeek needs "Global" regions in the
#     console Privacy settings; DeepSeek peak 01-04 + 06-10 UTC Mon-Fri costs 2x)
#   zen-* names -> OpenCode Zen credits, pay per token (overflow when a Go limit is hit)
#   *-cli names -> that native tool's own login (Kimi Code, Qwen Code, dsh, pi)
# sonnet / haiku / opus always mean the Claude Code implementer subagent on the Claude subscription
# and are never sent to another harness (Go also lists claude-haiku-5-5; concord.py refuses it).

default = deepseek-flash                   # cheapest adequate model; used when a phase names none
ladder = deepseek-flash, sonnet            # escalation on repeated EXECUTOR failure, only when the user asks
lint = deepseek-flash                      # read-only pre-flight reviewer (--lint); must be a non-Claude model

# Claude - implementer subagent (Claude subscription)
sonnet                          = claude    sonnet
haiku                           = claude    haiku
opus                            = claude    opus

# OpenCode Go - subscription allowance (IDs from opencode.ai/inference/go/v1/models, 2026-10-12)
deepseek-flash, deepseek        = pi        opencode-go/deepseek-v4.1-flash#high   # effort high, not max
deepseek-v4-flash               = pi        opencode-go/deepseek-v4-flash
deepseek-pro                    = pi        opencode-go/deepseek-v4-pro
glm, glm-5.3                    = pi        opencode-go/glm-5.3
glm-flash, glm-5.3-flash        = pi        opencode-go/glm-5.3-flash
kimi, kimi-code, kimi-k2.7      = pi        opencode-go/kimi-k2.7-code
kimi-k3                         = pi        opencode-go/kimi-k3
qwen-max, qwen                  = pi        opencode-go/qwen3.8-max
qwen-flash                      = pi        opencode-go/qwen3.8-flash
qwen-plus                       = pi        opencode-go/qwen3.7-plus
minimax                         = pi        opencode-go/minimax-m3
beam, beam-free                 = pi        opencode-go/beam-free                  # free on Go

# OpenCode Zen - pay per token from OpenCode credits (use when Go is out of allowance)
zen-deepseek-flash              = pi        opencode/deepseek-v4.1-flash#high      # effort high, not max
zen-glm                         = pi        opencode/glm-5.3
zen-glm-flash                   = pi        opencode/glm-5.3-flash
zen-kimi                        = pi        opencode/kimi-k2.7-code
zen-kimi-k3                     = pi        opencode/kimi-k3
zen-qwen-max                    = pi        opencode/qwen3.8-max
zen-qwen-flash                  = pi        opencode/qwen3.8-flash
zen-minimax                     = pi        opencode/minimax-m3

# OpenCode Zen free tier - no credits; daily limit, then the Go alias above. These run on OpenCode: Zen answers
# pi with 429 "Free models work in OpenCode" (measured 2026-10-25).
free-deepseek-flash             = opencode  opencode/deepseek-v4.1-flash-free#high
free-glm-flash                  = opencode  opencode/glm-5.3-flash-free

# Native harnesses - each bills its own login/key. Uncomment once that tool is logged in and
# fill in the model name it expects (kimi: alias from ~/.kimi-code/config.toml; qwen: the model
# your Qwen auth allows; dsh: deepseek-official/<model>; pi: provider/id). pi runs get a per-run agent folder
# without pi's login (auth.json): a pi line needs its provider key in the environment.
# kimi-cli                      = kimi      <alias>
# qwen-cli                      = qwen      <model>
# deepseek-dsh                  = dsh       deepseek-official/deepseek-pro
# pi-<name>                     = pi        <provider/id>
