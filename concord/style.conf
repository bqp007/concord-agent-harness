# Concord prose style for executor tasks and review prompts.
# prose = lean (the default): lean STE, short active sentences with articles, no filler, hedging or praise.
#   `terse`, `lean` and an empty value all select the lean STE default.
#   Or write a sentence of your own, which replaces that line, e.g.
#   prose = Write all prose in fragments: exact, no filler, no hedging, no praise.
# Read from $CLAUDE_HOME/concord/style.conf, else next to concord.py. Installed with keep.
prose = lean
