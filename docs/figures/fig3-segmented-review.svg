<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>text{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;fill:#111827}.t{font-size:14.5px;font-weight:700}.s{font-size:12px;fill:#334155}.w{font-size:12px;fill:#b91c1c;font-weight:600}</style>
  </defs>
  <rect width="1000" height="440" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" class="t" style="font-size:19px">Reviewing a diff too big for one prompt</text>

  <rect x="20" y="180" width="140" height="84" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.8"/>
  <text x="90" y="214" text-anchor="middle" class="t">Diff</text><text x="90" y="236" text-anchor="middle" class="s">e.g. 130k chars</text>

  <rect x="195" y="180" width="160" height="84" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="275" y="210" text-anchor="middle" class="t">Split</text><text x="275" y="230" text-anchor="middle" class="s">by top-level folder</text><text x="275" y="248" text-anchor="middle" class="s">≤ 60k chars each</text>
  <line x1="160" y1="222" x2="192" y2="222" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="400" y="70" width="170" height="70" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="485" y="100" text-anchor="middle" class="t">Segment 1</text><text x="485" y="120" text-anchor="middle" class="s">cheap reviewer</text>
  <rect x="400" y="187" width="170" height="70" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="485" y="217" text-anchor="middle" class="t">Segment 2</text><text x="485" y="237" text-anchor="middle" class="s">cheap reviewer</text>
  <rect x="400" y="304" width="170" height="70" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="485" y="334" text-anchor="middle" class="t">Segment 3</text><text x="485" y="354" text-anchor="middle" class="w">crashed → UNREVIEWED</text>
  <text x="485" y="400" text-anchor="middle" class="s">up to 3 at once · each sees the full file list, owns one segment</text>
  <path d="M355,222 C380,222 375,105 397,105" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="355" y1="222" x2="397" y2="222" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M355,222 C380,222 375,339 397,339" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="615" y="172" width="160" height="100" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="695" y="200" text-anchor="middle" class="t">Merge</text><text x="695" y="222" text-anchor="middle" class="s">overlapping findings</text><text x="695" y="240" text-anchor="middle" class="s">→ one, highest severity</text><text x="695" y="258" text-anchor="middle" class="s">no extra model call</text>
  <path d="M570,105 C595,105 590,215 612,215" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="570" y1="222" x2="612" y2="222" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M570,339 C595,339 590,230 612,230" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>

  <rect x="810" y="60" width="175" height="150" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="897" y="88" text-anchor="middle" class="t">Ground + filter</text><text x="897" y="108" text-anchor="middle" class="s">against the FULL diff</text>
  <text x="826" y="136" class="s">outside the diff → NOTE</text><text x="826" y="158" class="s">fix is a TODO → NOTE</text><text x="826" y="180" class="s">fix only deletes → NOTE</text>
  <path d="M775,222 C795,222 790,135 807,135" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="810" y="262" width="175" height="96" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.8"/>
  <text x="897" y="292" text-anchor="middle" class="t">One verdict</text><text x="897" y="314" text-anchor="middle" class="s">BLOCK / FIX / CLEAN</text><text x="897" y="338" text-anchor="middle" class="w">UNREVIEWED ⇒ never CLEAN</text>
  <line x1="897" y1="210" x2="897" y2="258" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
</svg>
