<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 575" width="1000" height="575">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <style>text{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;fill:#111827}.t{font-size:14.5px;font-weight:700}.s{font-size:12px;fill:#334155}.m{font-size:12.5px;fill:#334155}.q{font-size:11.5px;fill:#334155}</style>
  </defs>
  <rect width="1000" height="575" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" class="t" style="font-size:19px">One ticket, end to end</text>

  <!-- row 1: planning, left to right -->
  <rect x="20" y="60" width="110" height="74" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="75" y="92" text-anchor="middle" class="t">Ticket</text><text x="75" y="112" text-anchor="middle" class="s">own git worktree</text>
  <rect x="148" y="60" width="180" height="74" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="238" y="86" text-anchor="middle" class="t">Plan</text><text x="238" y="105" text-anchor="middle" class="s">Done when · phases · Files</text><text x="238" y="122" text-anchor="middle" class="s">Follow-through · callers</text>
  <polygon points="350,97 390,60 430,97 390,134" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="390" y="96" text-anchor="middle" class="q">parts land</text><text x="390" y="110" text-anchor="middle" class="q">apart?</text>
  <rect x="450" y="60" width="140" height="74" rx="10" fill="#f3f4f6" stroke="#b91c1c" stroke-width="2.4"/>
  <text x="520" y="86" text-anchor="middle" class="t">Grill</text><text x="520" y="105" text-anchor="middle" class="s">at most 5 questions</text><text x="520" y="122" text-anchor="middle" class="s">each with a default</text>
  <rect x="610" y="60" width="190" height="74" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="705" y="86" text-anchor="middle" class="t">Verify</text><text x="705" y="105" text-anchor="middle" class="s">lint · verifier APPROVE</text><text x="705" y="122" text-anchor="middle" class="s">estimate · ETA</text>
  <rect x="820" y="60" width="160" height="74" rx="10" fill="#f3f4f6" stroke="#b91c1c" stroke-width="2.4"/>
  <text x="900" y="86" text-anchor="middle" class="t">Your go</text><text x="900" y="105" text-anchor="middle" class="s">lanes · ETA · cuts</text><text x="900" y="122" text-anchor="middle" class="s">nothing runs before</text>
  <line x1="130" y1="97" x2="145" y2="97" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="328" y1="97" x2="347" y2="97" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="430" y1="97" x2="447" y2="97" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="440" y="89" text-anchor="middle" class="q">no</text>
  <line x1="590" y1="97" x2="607" y2="97" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="800" y1="97" x2="817" y2="97" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="900" y1="134" x2="900" y2="258" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- a large ticket splits; each child is a ticket of its own -->
  <line x1="390" y1="134" x2="390" y2="161" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="398" y="152" class="q">yes</text>
  <rect x="295" y="164" width="190" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="390" y="189" text-anchor="middle" class="t">Split plan</text><text x="390" y="208" text-anchor="middle" class="s">child tickets cut at seams</text><text x="390" y="224" text-anchor="middle" class="s">verified · one go</text>
  <path d="M295,199 C150,199 75,185 75,138" fill="none" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#p)"/>
  <text x="180" y="220" text-anchor="middle" class="m" style="fill:#6d28d9">each child runs this loop</text>

  <!-- row 2: building, right to left -->
  <rect x="820" y="262" width="160" height="74" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="900" y="288" text-anchor="middle" class="t">Tests first</text><text x="900" y="307" text-anchor="middle" class="s">own run, must fail</text><text x="900" y="324" text-anchor="middle" class="s">for the stated reason</text>
  <rect x="642" y="262" width="160" height="74" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="722" y="288" text-anchor="middle" class="t">Implement</text><text x="722" y="307" text-anchor="middle" class="s">bulky: cheap model</text><text x="722" y="324" text-anchor="middle" class="s">Files + Follow-through</text>
  <rect x="474" y="262" width="150" height="74" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="549" y="288" text-anchor="middle" class="t">Check</text><text x="549" y="307" text-anchor="middle" class="s">out of scope: rejected</text><text x="549" y="324" text-anchor="middle" class="s">follow-through listed</text>
  <rect x="276" y="262" width="180" height="74" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="366" y="288" text-anchor="middle" class="t">Review</text><text x="366" y="307" text-anchor="middle" class="s">flash · Opus 5.5 by risk</text><text x="366" y="324" text-anchor="middle" class="s">high: both families</text>
  <rect x="148" y="262" width="110" height="74" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="203" y="288" text-anchor="middle" class="t">Report</text><text x="203" y="307" text-anchor="middle" class="s">overrides first</text><text x="203" y="324" text-anchor="middle" class="s">repo notes</text>
  <rect x="20" y="262" width="110" height="74" rx="10" fill="#f3f4f6" stroke="#b91c1c" stroke-width="2.4"/>
  <text x="75" y="288" text-anchor="middle" class="t">You commit</text><text x="75" y="307" text-anchor="middle" class="s">PR gate, then</text><text x="75" y="324" text-anchor="middle" class="s">you merge</text>
  <line x1="820" y1="299" x2="805" y2="299" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="642" y1="299" x2="627" y2="299" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="474" y1="299" x2="459" y2="299" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="276" y1="299" x2="261" y2="299" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="148" y1="299" x2="133" y2="299" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- feedback loops -->
  <path d="M549,262 C549,236 722,236 722,258" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="635" y="232" text-anchor="middle" class="m" style="fill:#b91c1c">FAIL: its cause decides</text>
  <path d="M366,336 C366,384 722,384 722,340" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="544" y="400" text-anchor="middle" class="m" style="fill:#b91c1c">confirmed findings → fix → delta review</text>

  <rect x="180" y="420" width="640" height="136" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="200" y="446" class="t" style="font-size:13.5px">A FAIL always names its cause, and the cause decides where work goes back</text>
  <text x="200" y="470" class="m"><tspan font-weight="700">EXECUTOR</tspan> → implement again with evidence (three failures, then you decide)</text>
  <text x="200" y="492" class="m"><tspan font-weight="700">PLAN_GAP</tspan> → restore, fix the plan, verify it again (not an attempt)</text>
  <text x="200" y="514" class="m"><tspan font-weight="700">BLOCKED</tspan> → answer in the plan, run again · <tspan font-weight="700">PROVIDER</tspan> → the next model</text>
  <text x="200" y="536" class="m"><tspan font-weight="700">TEST_DEFECT</tspan> → fix the tests · <tspan font-weight="700">FLAKY</tspan> → re-run</text>

  <rect x="20" y="424" width="14" height="14" fill="#ede9fe" stroke="#6d28d9"/><text x="40" y="436" class="s">planner</text>
  <rect x="20" y="446" width="14" height="14" fill="#ccfbf1" stroke="#0f766e"/><text x="40" y="458" class="s">cheap model</text>
  <rect x="20" y="468" width="14" height="14" fill="#fef3c7" stroke="#b45309"/><text x="40" y="480" class="s">verifier, reviewers</text>
  <rect x="20" y="490" width="14" height="14" fill="#f3f4f6" stroke="#b91c1c" stroke-width="2"/><text x="40" y="502" class="s">human gate</text>
</svg>
