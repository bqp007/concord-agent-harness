<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#111827}.title{font-size:19px;font-weight:700}.t{font-size:14.5px;font-weight:700}.s{font-size:12.5px}.m{font-size:12px;fill:#475569}.q{font-size:11.5px}.h{font-size:11.5px;font-weight:700;fill:#475569;letter-spacing:.06em}.b{font-weight:600}.c{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style>
  </defs>
  <rect width="960" height="470" rx="12" fill="#FFFFFF"/>
  <text x="480" y="34" text-anchor="middle" class="title">Who does what</text>
  <text x="480" y="98" text-anchor="middle" class="h" style="fill:#6D28D9">FRONTIER TOKENS: JUDGMENT ONLY</text>
  <text x="845" y="118" text-anchor="middle" class="h" style="fill:#0F766E">CHEAP TOKENS: TYPING</text>

  <rect x="30" y="150" width="180" height="120" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="120" y="180" text-anchor="middle" class="t">You</text>
  <text x="120" y="205" text-anchor="middle" class="s">answer the grill</text>
  <text x="120" y="227" text-anchor="middle" class="s">approve the plan</text>
  <text x="120" y="249" text-anchor="middle" class="s">commit and merge</text>

  <rect x="360" y="115" width="240" height="175" rx="8" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="480" y="148" text-anchor="middle" class="t">Planner</text>
  <text x="480" y="173" text-anchor="middle" class="s">Fable 5.1 (high) or Opus 5.5 (max)</text>
  <text x="480" y="203" text-anchor="middle" class="s">plans · checks failing tests</text>
  <text x="480" y="225" text-anchor="middle" class="s">checks · confirms every finding</text>
  <text x="480" y="266" text-anchor="middle" class="m">Claude subscription</text>

  <rect x="750" y="135" width="190" height="145" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
  <text x="845" y="168" text-anchor="middle" class="t">Implementer</text>
  <text x="845" y="193" text-anchor="middle" class="s">DeepSeek or GLM Flash</text>
  <text x="845" y="217" text-anchor="middle" class="s">writes the phase's code</text>
  <text x="845" y="258" text-anchor="middle" class="m">Zen free tier, then Go</text>
  <text x="845" y="304" text-anchor="middle" class="m" style="fill:#B91C1C">edits only the tests its phase lists</text>
  <text x="845" y="321" text-anchor="middle" class="m" style="fill:#B91C1C">never reviews itself</text>

  <rect x="330" y="350" width="300" height="100" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="480" y="380" text-anchor="middle" class="t">Reviewers, fresh context</text>
  <text x="480" y="405" text-anchor="middle" class="s">Flash at low · Opus 5.5 at medium</text>
  <text x="480" y="427" text-anchor="middle" class="s">Opus 5.5 and Flash at high</text>

  <rect x="40" y="330" width="240" height="120" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="160" y="362" text-anchor="middle" class="t">Plan verifier</text>
  <text x="160" y="387" text-anchor="middle" class="s">Fable 5.1, or Opus 5.5</text>
  <text x="160" y="409" text-anchor="middle" class="s">when Fable plans</text>
  <text x="160" y="436" text-anchor="middle" class="m">APPROVE binds the plan text</text>
  <line x1="362" y1="284" x2="284" y2="338" stroke="#475569" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="314" y="300" text-anchor="end" class="m">plan read · VERDICT</text>

  <line x1="212" y1="190" x2="356" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="284" y="180" text-anchor="middle" class="m">ticket · approval</text>
  <line x1="358" y1="240" x2="214" y2="240" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="284" y="260" text-anchor="middle" class="m">checked diff</text>

  <line x1="602" y1="180" x2="746" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="674" y="170" text-anchor="middle" class="m">plan phase + tests</text>
  <line x1="748" y1="235" x2="604" y2="235" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="674" y="255" text-anchor="middle" class="m">DELEGATE RESULT</text>

  <line x1="440" y1="292" x2="440" y2="346" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="430" y="325" text-anchor="end" class="m">diff</text>
  <line x1="520" y1="348" x2="520" y2="294" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="530" y="325" class="m">findings = claims</text>
</svg>
