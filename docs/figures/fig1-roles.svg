<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>text{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;fill:#111827}.t{font-size:17px;font-weight:700}.s{font-size:13.5px}.m{font-size:12px;fill:#475569}.l{font-size:12.5px;fill:#334155}</style>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" class="t" style="font-size:19px">Who does what</text>
  <text x="480" y="98" text-anchor="middle" class="m" style="fill:#6d28d9;font-weight:600">FRONTIER TOKENS: JUDGMENT ONLY</text>
  <text x="845" y="118" text-anchor="middle" class="m" style="fill:#0f766e;font-weight:600">CHEAP TOKENS: TYPING</text>

  <rect x="30" y="150" width="180" height="120" rx="12" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="120" y="180" text-anchor="middle" class="t">You</text>
  <text x="120" y="205" text-anchor="middle" class="s">answer the grill</text>
  <text x="120" y="227" text-anchor="middle" class="s">approve the plan</text>
  <text x="120" y="249" text-anchor="middle" class="s">commit and merge</text>

  <rect x="360" y="115" width="240" height="175" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="480" y="148" text-anchor="middle" class="t">Planner</text>
  <text x="480" y="173" text-anchor="middle" class="s">Fable 5.1 (high) or Opus 5.5 (max)</text>
  <text x="480" y="203" text-anchor="middle" class="s">plans · checks failing tests</text>
  <text x="480" y="225" text-anchor="middle" class="s">checks · confirms every finding</text>
  <text x="480" y="266" text-anchor="middle" class="m">Claude subscription</text>

  <rect x="750" y="135" width="190" height="145" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="845" y="168" text-anchor="middle" class="t">Implementer</text>
  <text x="845" y="193" text-anchor="middle" class="s">DeepSeek or GLM Flash</text>
  <text x="845" y="217" text-anchor="middle" class="s">writes the phase's code</text>
  <text x="845" y="258" text-anchor="middle" class="m">Zen free tier, then Go</text>
  <text x="845" y="304" text-anchor="middle" class="m" style="fill:#b91c1c">edits only the tests its phase lists</text>
  <text x="845" y="321" text-anchor="middle" class="m" style="fill:#b91c1c">never reviews itself</text>

  <rect x="330" y="350" width="300" height="100" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="480" y="380" text-anchor="middle" class="t">Reviewers, fresh context</text>
  <text x="480" y="405" text-anchor="middle" class="s">Flash at low · Opus 5.5 at medium</text>
  <text x="480" y="427" text-anchor="middle" class="s">Opus 5.5 and Flash at high</text>

  <rect x="40" y="330" width="240" height="120" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="160" y="362" text-anchor="middle" class="t">Plan verifier</text>
  <text x="160" y="387" text-anchor="middle" class="s">Fable 5.1, or Opus 5.5</text>
  <text x="160" y="409" text-anchor="middle" class="s">when Fable plans</text>
  <text x="160" y="436" text-anchor="middle" class="m">APPROVE binds the plan text</text>
  <line x1="362" y1="284" x2="284" y2="338" stroke="#475569" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="314" y="300" text-anchor="end" class="l">plan read · VERDICT</text>

  <line x1="212" y1="190" x2="356" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="284" y="180" text-anchor="middle" class="l">ticket · approval</text>
  <line x1="358" y1="240" x2="214" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="284" y="260" text-anchor="middle" class="l">checked diff</text>

  <line x1="602" y1="180" x2="746" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="674" y="170" text-anchor="middle" class="l">plan phase + tests</text>
  <line x1="748" y1="235" x2="604" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="674" y="255" text-anchor="middle" class="l">DELEGATE RESULT</text>

  <line x1="440" y1="292" x2="440" y2="346" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="430" y="325" text-anchor="end" class="l">diff</text>
  <line x1="520" y1="348" x2="520" y2="294" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="530" y="325" class="l">findings = claims</text>
</svg>
