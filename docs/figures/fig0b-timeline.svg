<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420">
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#111827}.title{font-size:19px;font-weight:700}.t{font-size:14.5px;font-weight:700}.s{font-size:12.5px}.m{font-size:12px;fill:#475569}.q{font-size:11.5px}.h{font-size:11.5px;font-weight:700;fill:#475569;letter-spacing:.06em}.b{font-weight:600}.c{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style></defs>
  <rect width="1120" height="420" rx="12" fill="#FFFFFF"/>
  <text x="560" y="30" text-anchor="middle" class="title">How the workflow grew, October 2026</text>
  <line x1="40" y1="210" x2="1080" y2="210" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>

  <circle cx="80" cy="210" r="9" fill="#6D28D9"/>
  <text x="80" y="60" text-anchor="middle" class="s" style="fill:#6D28D9;font-weight:700">10–11 Oct</text>
  <text x="80" y="80" text-anchor="middle" class="t">Literature review</text>
  <text x="80" y="98" text-anchor="middle" class="q">intent + architecture,</text>
  <text x="80" y="114" text-anchor="middle" class="q">15 canonical papers</text>
  <text x="80" y="130" text-anchor="middle" class="q">→ plan-then-delegate;</text>
  <text x="80" y="146" text-anchor="middle" class="q">first run: 9.9 s, ~44k tok</text>
  <line x1="80" y1="156" x2="80" y2="200" stroke="#94A3B8" stroke-width="1.5"/>

  <circle cx="215" cy="210" r="9" fill="#0F766E"/>
  <text x="215" y="250" text-anchor="middle" class="s" style="fill:#0F766E;font-weight:700">12–13 Oct</text>
  <text x="215" y="270" text-anchor="middle" class="t">One cheap executor</text>
  <text x="215" y="288" text-anchor="middle" class="q">billing research; DeepSeek</text>
  <text x="215" y="304" text-anchor="middle" class="q">Flash for every phase;</text>
  <text x="215" y="320" text-anchor="middle" class="q">lean plans: tests → one run</text>
  <line x1="215" y1="220" x2="215" y2="236" stroke="#94A3B8" stroke-width="1.5"/>

  <circle cx="350" cy="210" r="9" fill="#6D28D9"/>
  <text x="350" y="94" text-anchor="middle" class="s" style="fill:#6D28D9;font-weight:700">14 Oct</text>
  <text x="350" y="114" text-anchor="middle" class="t">Metric first</text>
  <text x="350" y="132" text-anchor="middle" class="q">no expected metric move</text>
  <text x="350" y="148" text-anchor="middle" class="q">→ item cut before planning</text>
  <line x1="350" y1="156" x2="350" y2="200" stroke="#94A3B8" stroke-width="1.5"/>

  <circle cx="490" cy="210" r="9" fill="#1D4ED8"/>
  <text x="490" y="250" text-anchor="middle" class="s" style="fill:#1D4ED8;font-weight:700">15 Oct</text>
  <text x="490" y="270" text-anchor="middle" class="t">Tiers + isolation</text>
  <text x="490" y="288" text-anchor="middle" class="q">review tiers (Flash / Opus);</text>
  <text x="490" y="304" text-anchor="middle" class="q">one worktree per ticket;</text>
  <text x="490" y="320" text-anchor="middle" class="q">rule engine; 144-run snapshot</text>
  <line x1="490" y1="220" x2="490" y2="236" stroke="#94A3B8" stroke-width="1.5"/>

  <circle cx="630" cy="210" r="9" fill="#6D28D9"/>
  <text x="630" y="78" text-anchor="middle" class="s" style="fill:#6D28D9;font-weight:700">16 Oct</text>
  <text x="630" y="98" text-anchor="middle" class="t">Independence + speed</text>
  <text x="630" y="116" text-anchor="middle" class="q">reviewer = fresh agent;</text>
  <text x="630" y="132" text-anchor="middle" class="q">parallel by default; PR gate;</text>
  <text x="630" y="148" text-anchor="middle" class="q">Concord economic model</text>
  <line x1="630" y1="156" x2="630" y2="200" stroke="#94A3B8" stroke-width="1.5"/>

  <circle cx="770" cy="210" r="9" fill="#0F766E"/>
  <text x="770" y="250" text-anchor="middle" class="s" style="fill:#0F766E;font-weight:700">18 Oct (a)</text>
  <text x="770" y="270" text-anchor="middle" class="t">Nine papers</text>
  <text x="770" y="288" text-anchor="middle" class="q">10 changes: filters,</text>
  <text x="770" y="304" text-anchor="middle" class="q">hashes, segmented review,</text>
  <text x="770" y="320" text-anchor="middle" class="q">plan-only review, ledger</text>
  <line x1="770" y1="220" x2="770" y2="236" stroke="#94A3B8" stroke-width="1.5"/>

  <circle cx="905" cy="210" r="9" fill="#6D28D9"/>
  <text x="905" y="78" text-anchor="middle" class="s" style="fill:#6D28D9;font-weight:700">18 Oct (b)</text>
  <text x="905" y="98" text-anchor="middle" class="t">Token economy</text>
  <text x="905" y="116" text-anchor="middle" class="q">planner at max effort;</text>
  <text x="905" y="132" text-anchor="middle" class="q">compact at 400k window;</text>
  <text x="905" y="148" text-anchor="middle" class="q">terse prose; Flash #max</text>
  <line x1="905" y1="156" x2="905" y2="200" stroke="#94A3B8" stroke-width="1.5"/>

  <circle cx="1030" cy="210" r="9" fill="#1D4ED8"/>
  <text x="1030" y="250" text-anchor="middle" class="s" style="fill:#1D4ED8;font-weight:700">20–21 Oct</text>
  <text x="1030" y="270" text-anchor="middle" class="t">Packaged + linted</text>
  <text x="1030" y="288" text-anchor="middle" class="q">released as Concord;</text>
  <text x="1030" y="304" text-anchor="middle" class="q">acceptance lint, 0 tokens;</text>
  <text x="1030" y="320" text-anchor="middle" class="q">big diffs reviewed by group</text>
  <line x1="1030" y1="220" x2="1030" y2="236" stroke="#94A3B8" stroke-width="1.5"/>

  <text x="560" y="380" text-anchor="middle" class="m">Regression checks on Concord: 62 on 15 Oct, 154 on 18 Oct, 317 on 21 Oct. Dispatcher: ~2,300 lines on 15 Oct, ~3,400 on 18 Oct, ~5,000 on 21 Oct.</text>
</svg>
