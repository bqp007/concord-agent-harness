<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="780" height="370">
  <defs><style>text{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;fill:#111827}.s{font-size:12px;fill:#475569}.t{font-size:13px;font-weight:600}</style></defs>
  <rect width="780" height="370" fill="#ffffff"/>
  <text x="390" y="30" text-anchor="middle" style="font-size:17px;font-weight:700">Context size over a long planning session</text>
  <line x1="70" y1="290" x2="740" y2="290" stroke="#374151" stroke-width="1.5"/>
  <line x1="70" y1="290" x2="70" y2="55" stroke="#374151" stroke-width="1.5"/>
  <text x="62" y="294" text-anchor="end" class="s">0</text><text x="62" y="183" text-anchor="end" class="s">200k</text><text x="62" y="72" text-anchor="end" class="s">400k</text>
  <line x1="70" y1="179" x2="740" y2="179" stroke="#e5e7eb"/>
  <rect x="70" y="73" width="670" height="17" fill="#fef3c7"/>
  <line x1="70" y1="68" x2="740" y2="68" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="736" y="62" text-anchor="end" class="t" style="fill:#b45309">autoCompactWindow = 400k</text>
  <text x="736" y="104" text-anchor="end" class="s">compaction fires at window − summary buffer (≈360–390k)</text>
  <path d="M70,272 L300,80 L300,268 L530,80 L530,268 L700,150" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="300" cy="80" r="5" fill="#b45309"/><circle cx="530" cy="80" r="5" fill="#b45309"/>
  <text x="300" y="312" text-anchor="middle" class="s">compaction</text><text x="530" y="312" text-anchor="middle" class="s">compaction</text>
  <text x="405" y="335" text-anchor="middle" class="s">turns →   (every turn re-sends the whole context, so the top of each tooth is the expensive part)</text>
  <rect x="90" y="120" width="190" height="62" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="185" y="143" text-anchor="middle" class="t">PLAN_&lt;ticket&gt;.md</text>
  <text x="185" y="163" text-anchor="middle" class="s">lives outside the chat; re-read</text>
  <text x="185" y="177" text-anchor="middle" class="s">after every compaction [7]</text>
</svg>
