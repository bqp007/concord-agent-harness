<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="780" height="370">
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#111827}.title{font-size:19px;font-weight:700}.t{font-size:14.5px;font-weight:700}.s{font-size:12.5px}.m{font-size:12px;fill:#475569}.q{font-size:11.5px}.h{font-size:11.5px;font-weight:700;fill:#475569;letter-spacing:.06em}.b{font-weight:600}.c{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style></defs>
  <rect width="780" height="370" rx="12" fill="#FFFFFF"/>
  <text x="390" y="30" text-anchor="middle" class="title">Context size over a long planning session</text>
  <line x1="70" y1="290" x2="740" y2="290" stroke="#475569" stroke-width="1.5"/>
  <line x1="70" y1="290" x2="70" y2="55" stroke="#475569" stroke-width="1.5"/>
  <text x="62" y="294" text-anchor="end" class="m">0</text><text x="62" y="183" text-anchor="end" class="m">200k</text><text x="62" y="72" text-anchor="end" class="m">400k</text>
  <line x1="70" y1="179" x2="740" y2="179" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="70" y="73" width="670" height="17" fill="#F1F5F9"/>
  <line x1="70" y1="68" x2="740" y2="68" stroke="#475569" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="736" y="60" text-anchor="end" class="s c" style="font-weight:700">autoCompactWindow = 400k</text>
  <text x="736" y="107" text-anchor="end" class="m">compaction fires at window −</text>
  <text x="736" y="122" text-anchor="end" class="m">summary buffer (≈360–390k)</text>
  <path d="M70,272 L300,80 L300,268 L530,80 L530,268 L700,150" fill="none" stroke="#6D28D9" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="300" cy="80" r="5" fill="#111827"/><circle cx="530" cy="80" r="5" fill="#111827"/>
  <text x="300" y="312" text-anchor="middle" class="m">compaction</text><text x="530" y="312" text-anchor="middle" class="m">compaction</text>
  <text x="405" y="335" text-anchor="middle" class="m">turns →   (every turn re-sends the whole context, so the top of each tooth is the expensive part)</text>
  <rect x="90" y="120" width="190" height="62" rx="8" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="185" y="143" text-anchor="middle" class="t c">PLAN_&lt;ticket&gt;.md</text>
  <text x="185" y="163" text-anchor="middle" class="m">lives outside the chat; re-read</text>
  <text x="185" y="177" text-anchor="middle" class="m">after every compaction [7]</text>
</svg>
