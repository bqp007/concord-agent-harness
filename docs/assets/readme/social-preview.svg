<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Concord: a governed workflow for AI coding agents">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ah-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#111827}.word{font-size:44px;font-weight:600;fill:#6D28D9}.sub{font-size:34px;fill:#475569}.step{font-size:19px;font-weight:700}.note{font-size:17px;fill:#B91C1C}</style>
  </defs>
  <rect width="1280" height="640" rx="12" fill="#FFFFFF"/>

  <g transform="translate(273.4 86.4) scale(2.6)">
    <circle cx="30" cy="36" r="20" fill="none" stroke="#6D28D9" stroke-width="6"/>
    <circle cx="52" cy="36" r="20" fill="none" stroke="#0F766E" stroke-width="6"/>
    <text class="word" x="88" y="52">Concord</text>
  </g>
  <text x="640" y="300" text-anchor="middle" class="sub">A governed workflow for AI coding agents</text>

  <rect x="53" y="420" width="124" height="60" rx="10" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="115" y="457" text-anchor="middle" class="step">Plan</text>
  <rect x="203" y="420" width="124" height="60" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="265" y="457" text-anchor="middle" class="step">Verify</text>
  <rect x="353" y="420" width="124" height="60" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="415" y="457" text-anchor="middle" class="step">Your go</text>
  <rect x="503" y="420" width="124" height="60" rx="10" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="565" y="457" text-anchor="middle" class="step">Tests first</text>
  <rect x="653" y="420" width="124" height="60" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="715" y="457" text-anchor="middle" class="step">Implement</text>
  <rect x="803" y="420" width="124" height="60" rx="10" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="865" y="457" text-anchor="middle" class="step">Check</text>
  <rect x="953" y="420" width="124" height="60" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="1015" y="457" text-anchor="middle" class="step">Review</text>
  <rect x="1103" y="420" width="124" height="60" rx="10" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="1165" y="457" text-anchor="middle" class="step">Report</text>

  <line x1="179" y1="450" x2="200" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="329" y1="450" x2="350" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="479" y1="450" x2="500" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="629" y1="450" x2="650" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="779" y1="450" x2="800" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="929" y1="450" x2="950" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="1079" y1="450" x2="1100" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <path d="M865,420 C865,384 715,384 715,416" fill="none" stroke="#B91C1C" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-stop)"/>
  <text x="790" y="378" text-anchor="middle" class="note">FAIL: its cause decides</text>
  <path d="M1015,480 C1015,530 715,530 715,484" fill="none" stroke="#B91C1C" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-stop)"/>
  <text x="865" y="550" text-anchor="middle" class="note">confirmed findings → fix → delta review</text>
</svg>
