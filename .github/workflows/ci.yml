name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # the main-branch ruleset requires "test (ubuntu-latest)" and "test (macos-latest)"; the extra Python run keeps its version in the name
    name: ${{ matrix.python == '3.12' && format('test ({0})', matrix.os) || format('test ({0}, {1})', matrix.os, matrix.python) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12"]
        include:
          # the oldest Python the documents support
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Concord suites
        run: bash concord/tests/run_all.sh
      - name: Repository checks
        run: bash tests/package_test.sh
      - name: Demo without credentials
        run: bash tests/demo_test.sh
