name: pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
# Deploy runs as its own job so the uploaded artifact is listed before deploy-pages looks for it.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # the site names the MIT license; the artifact carries its full text
      - name: Add the license to the site
        run: cp LICENSE site/LICENSE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
