name: Bug report
description: Something in Concord does not work as its documentation says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Security problems go to private vulnerability reporting, not here (see SECURITY.md). Remove secrets, private paths and internal names from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran and the output or behavior you saw.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of commands that shows the problem, for example with the demo repository from `bash scripts/demo.sh --keep`.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected instead, and the documentation that says so if there is one.
    validations:
      required: true
  - type: input
    id: concord-version
    attributes:
      label: Concord version
      description: The `version` in `adapters/claude-code/.claude-plugin/plugin.json`, or the commit you installed from.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.2, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: The output of `python3 --version`.
    validations:
      required: true
  - type: input
    id: executor
    attributes:
      label: Executor and its version
      description: The harness that ran the phase (pi, OpenCode, Qwen Code, a Claude Code session or another) and its version, or "none" for execute mode or the demo.
    validations:
      required: true
  - type: textarea
    id: models-verify
    attributes:
      label: Output of concord.py --models --verify (optional)
      description: The output of `python3 ~/.claude/concord/concord.py --models --verify`, when the problem involves a model or an executor.
      render: text
    validations:
      required: false
